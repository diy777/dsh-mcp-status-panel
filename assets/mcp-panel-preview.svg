  <rect x="22" y="22" width="1156" height="676" rx="20" fill="#1d2026" stroke="#353a44" filter="url(#shadow)"/>
  <rect x="22" y="22" width="238" height="676" rx="20" fill="#17191e"/>
  <path d="M260 22v676" stroke="#30343d"/>
